name: Elixir CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ash-ci:
    uses: ash-project/ash/.github/workflows/ash-ci.yml@main
    permissions:
      contents: write
      security-events: write
      pages: write
      id-token: write
    with:
      postgres: true
      postgres-version: "16"
      # The test suite migrates and sandboxes its own database in
      # test_helper.exs, so the shared workflow's ash_postgres setup steps are
      # not wanted — only the Postgres service is.
      ash_postgres: false
      ecto_postgres: false
      tenants: false
      sobelow: false
      changelog-lint: false
      reuse: true
      # This library defines no Spark DSL extension: it ships `use` macros that
      # instantiate ordinary Ash resources. `mix spark.formatter --check` runs
      # bare and fails ("must supply a comma separated list of extensions"),
      # and there are no cheat sheets to generate.
      spark-formatter: false
      spark-cheat-sheets: false
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
